[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "ruocun"
dynamic = ["version"]
description = "若存 Code（RuoCun）— Python 终端编码助手"
readme = "README.md"
requires-python = "==3.11.*"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md", "THIRD-PARTY-LICENSES.txt"]
dependencies = ["prompt_toolkit==3.0.52", "rich==14.1.0", "wcwidth==0.9.4", "mcp==1.30.0", "tree-sitter==0.25.2", "tree-sitter-go==0.25.0", "tree-sitter-java==0.23.5", "tree-sitter-javascript==0.25.0", "tree-sitter-python==0.25.0", "tree-sitter-rust==0.24.0", "tree-sitter-typescript==0.23.2"]

[project.optional-dependencies]
observation = ["opentelemetry-api==1.45.2", "opentelemetry-sdk==1.45.2", "opentelemetry-exporter-otlp-proto-http==1.45.2", "opentelemetry-exporter-http-transport==0.66b2", "opentelemetry-exporter-otlp-common==0.66b2"]

[project.scripts]
ruocun = "ruocun.cli:main"

[tool.hatch.version]
path = "src/ruocun/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ruocun"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["/src/ruocun", "/pyproject.toml", "/hatch_build.py", "/README.md", "/LICENSE", "/NOTICE.md", "/THIRD-PARTY-LICENSES.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not oracle and not live and not terminal and not install'"
markers = [
  "oracle: frozen source CLI requires explicit controlled Node and dependencies",
  "live: real model access and explicit budget required",
  "terminal: visible Windows Terminal and final human acceptance required",
  "install: explicit isolated installation suite",
]

[tool.ruff]
required-version = "==0.17.3"
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py", "tools/**/*.py", "pyproject.toml"]
extend-exclude = [".scratch", "integration-evidence", ".worktrees", ".cache", ".venv", "build", "dist"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/ruocun", "tests/support/ruocun_acceptance", "tools"]
strict = true
explicit_package_bases = true
